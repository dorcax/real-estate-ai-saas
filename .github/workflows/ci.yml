# name of the workflow 

name: Aura AI CI

# run this workflow whenever code is pushed to the main branch note git push origin main trigger the workflow
on:
  push:
    branches:
      - main


# a job is a group of task that github runs
jobs:
  build:
  # runs-on: ubuntu-latest mean github gives your workflow a temporary linux machine
    runs-on: ubuntu-latest

# download my repository code onto the temporary macchine 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

# give me node version 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

# enable pnpm 
      - name: Enable Corepack
        run: corepack enable

      # - name: Allow build scripts
      #   run: pnpm config set allow-scripts true 

# install dependencies using the lock file
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build application
        run: pnpm run build

          Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

          # run docker application

      - name: Build Docker image
        run: docker build -f Dockerfile.prod -t ${{ secrets.DOCKERHUB_USERNAME }}/aura-api:latest .

        # Push Docker image
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/aura-api:latest
