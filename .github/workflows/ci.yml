# Name of the workflow
name: Aura AI CI/CD

# Run this workflow whenever code is pushed to the main branch.
# "git push origin main" will trigger the workflow.
on:
  push:
    branches:
      - main

# A job is a group of tasks that GitHub runs.
jobs:
  build:

    # GitHub gives your workflow a temporary Linux machine.
    runs-on: ubuntu-latest

    steps:

      # Download my repository code onto the temporary machine.
      - name: Checkout code
        uses: actions/checkout@v4

      # Give me Node.js version 24.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Enable pnpm.
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      # Install dependencies using the lock file.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
   

      # Generate Prisma Client.
      - name: Generate Prisma Client
        run: pnpm prisma generate

      # Build the application.
      - name: Build application
        run: pnpm run build

      # Log in to Docker Hub.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the Docker image.
      - name: Build Docker image
        run: docker build -f Dockerfile.prod -t ${{ secrets.DOCKERHUB_USERNAME }}/aura-api:latest .

      # Push the Docker image to Docker Hub.
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/aura-api:latest